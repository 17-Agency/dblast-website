name: Report beta giornaliero

on:
  schedule:
    # 08:00 UTC = 10:00 in Italia con l'ora legale, 09:00 in inverno.
    # In inverno, per avere le 10:00 esatte, cambia in: 0 9 * * *
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/daily-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node report.mjs
        env:
          BETA_API_URL: ${{ secrets.BETA_API_URL }}
          BETA_API_TOKEN: ${{ secrets.BETA_API_TOKEN }}
          ZOHO_HOST: ${{ secrets.ZOHO_HOST }}
          ZOHO_PORT: ${{ secrets.ZOHO_PORT }}
          ZOHO_SECURE: ${{ secrets.ZOHO_SECURE }}
          ZOHO_USER: ${{ secrets.ZOHO_USER }}
          ZOHO_PASS: ${{ secrets.ZOHO_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
